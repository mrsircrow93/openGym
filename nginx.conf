# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).

# Rate limiting keyed by the real client IP. Behind Cloudflare (tunnel or proxy) every request
# arrives from Cloudflare's address, so key on CF-Connecting-IP when it's there; otherwise the
# socket address. Two zones: a gentle one for the API as a whole and a strict one for the
# unauthenticated auth endpoints (invite-code probing, passkey brute force).
map $http_cf_connecting_ip $client_ip { default $remote_addr; "~." $http_cf_connecting_ip; }
limit_req_zone $client_ip zone=api:10m rate=20r/s;
limit_req_zone $client_ip zone=auth:10m rate=3r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Bodies: the app syncs its whole state as one JSON (a long history runs past nginx's 1 MB
    # default) and meal photos arrive as base64. The API enforces its own 5 MB ceiling too.
    client_max_body_size 6m;

    # ---- security headers (every response, including the SPA shell) ----
    # CSP: scripts only from this origin (Vite emits hashed files, no inline scripts); inline
    # styles are needed for React style attributes and the printable plan; images/GIFs may come
    # from the dataset CDN on builds that don't ship media; connect allows the bring-your-own-key
    # path straight to Anthropic. Everything else is locked to self.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; media-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://api.anthropic.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self), usb=(), bluetooth=(self)" always;
    # Only meaningful once TLS terminates in front (Cloudflare, a reverse proxy) — harmless on plain http.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Auth endpoints: strict limit, small bursts
    location ~ ^/api/(register|login|auth)/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → backend container
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI routes wait on the model (a trainer plan can take 30-60 s); the 60 s default cut them off.
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately.
    # (add_header in a nested location replaces the server-level set — repeat the security ones.)
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; media-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://api.anthropic.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self), usb=(), bluetooth=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
